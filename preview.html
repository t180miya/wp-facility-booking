<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WP Plugin Calendar Preview</title>
  <link rel="stylesheet" href="calendar.css">
</head>
<body>
  <main>
    <div class="wpplugin-calendar" data-preview="true" data-today="2026-09-22" data-default-name="preview-user" data-facilities='[{"id":"1","name":"ゲストルーム（洋室）","fee":"0円","start":"09:00","end":"18:00","info":"メモ欄に「利用人数」を記入してください。","additional_condition_1":"寝具","additional_fee_1":"3,000円","additional_condition_2":"リネン","additional_fee_2":"1,500円","reservation_type":"宿泊","stay_start":"15:00","stay_end":"10:00","stay_fee":"2,000円"},{"id":"2","name":"ゲストルーム（和室）","fee":"200円","start":"15:00","end":"24:00","info":"メモ欄に「利用人数」「用途」を記入してください。","additional_condition_1":"寝具","additional_fee_1":"3,000円","additional_condition_2":"リネン","additional_fee_2":"1,500円","reservation_type":"両方","stay_start":"15:00","stay_end":"10:00","stay_fee":"2,000円"},{"id":"3","name":"シアタールーム","fee":"200円","start":"09:00","end":"22:00","info":"予約可能期間：1ヶ月前〜3日前まで予約可能\n使用時間：原則として9:00〜22:00\n連続予約：1回の使用時間は3時間まで\n使用料：200円/時間","reservation_type":"時間貸"},{"id":"4","name":"アトリエ","fee":"200円","start":"09:00","end":"22:00","info":"予約可能期間：1ヶ月前〜3日前まで予約可能\n使用時間：原則として9:00〜22:00\n連続予約：1回の使用時間は3時間まで\n使用料：200円/時間\n電気釜を利用する場合は1回2,000円別途徴収","additional_condition_1":"電気釜","additional_fee_1":"2,000円","reservation_type":"時間貸"}]' data-reservations='[{"id":1,"facility_id":"3","date":"2026-09-05","start":"10:00","end":"11:30","title":"チーム定例ミーティング","name":"preview-user","details":"定例会議の予約です。","can_edit":true},{"id":2,"facility_id":"3","date":"2026-09-22","start":"14:00","end":"16:00","title":"施設利用サンプル","name":"preview-user","details":"施設利用のサンプルです。","can_edit":true},{"id":3,"facility_id":"2","date":"2026-09-22","start":"16:00","end":"17:30","title":"和室予約","name":"preview-user","details":"宿泊準備の予約です。","can_edit":true}]'>
      <p class="wpplugin-reservation__notice" role="status" hidden></p>
      <div class="wpplugin-calendar__header">
        <div class="wpplugin-calendar__selectors">
          <label><span class="screen-reader-text">施設を選択</span><select class="wpplugin-calendar__facility" aria-label="施設を選択"><option value="1">ゲストルーム（洋室）</option><option value="2">ゲストルーム（和室）</option><option value="3">シアタールーム</option><option value="4">アトリエ</option></select></label>
          <label><span class="screen-reader-text">年を選択</span><select class="wpplugin-calendar__year" aria-label="年を選択"></select></label>
          <label><span class="screen-reader-text">月を選択</span><select class="wpplugin-calendar__month" aria-label="月を選択"></select></label>
        </div>
      </div><button type="button" class="wpplugin-calendar__toggle" aria-expanded="false" aria-controls="wpplugin-calendar-panel">すべての日を表示</button><div class="wpplugin-calendar__date-picker"><label><span class="screen-reader-text">日付を指定</span><select class="wpplugin-calendar__date-select" aria-label="日付を指定"><option value="">日付を指定</option></select></label></div><div id="wpplugin-calendar-panel" class="wpplugin-calendar__panel" hidden><div class="wpplugin-calendar__grid"></div><div class="wpplugin-calendar__list"></div></div><div class="wpplugin-calendar__selected-date-list" hidden></div>
    </div>
    <section class="wpplugin-facility-info">
      <h2>施設情報</h2>
      <dl>
        <div><dt>施設名</dt><dd class="wpplugin-facility-info__name">会議室A</dd></div>
        <div class="wpplugin-facility-info__fee-row" hidden><dt class="wpplugin-facility-info__fee-label">利用料金</dt><dd class="wpplugin-facility-info__fee">0円</dd></div>
        <div class="wpplugin-facility-info__stay-fee-row"><dt>利用料金（宿泊）</dt><dd class="wpplugin-facility-info__stay-fee">2,000円／泊</dd></div>
        <div class="wpplugin-facility-info__hours-row" hidden><dt>利用可能時間（時間貸）</dt><dd class="wpplugin-facility-info__hours">09:00〜18:00</dd></div>
        <div class="wpplugin-facility-info__stay-hours-row"><dt>利用可能時間（宿泊）</dt><dd class="wpplugin-facility-info__stay-hours">15:00〜10:00 ※ 翌日</dd></div>
        <div class="wpplugin-facility-info__description-row"><dt>施設情報</dt><dd class="wpplugin-facility-info__description">メモ欄に「利用人数」を記入してください。</dd></div>
      </dl>
    </section>
    <section class="wpplugin-reservation" hidden>
      <h2>予約内容</h2>
      <form class="wpplugin-reservation__form" method="post" data-preview="true">
        <input type="hidden" class="wpplugin-reservation__id">
        <input type="hidden" class="wpplugin-reservation__facility-id" value="1">
        <p class="wpplugin-reservation__selected">選択日: <strong class="wpplugin-reservation__selected-date"></strong></p>
        <p class="wpplugin-reservation__error" role="alert" hidden></p>
        <input type="hidden" class="wpplugin-reservation__date" required>
        <label>予約タイトル<input type="text" name="reservation_title" maxlength="200" required></label>
        <label>予約者名<input type="text" name="reservation_name" value="preview-user" maxlength="60" required></label>
        <label class="wpplugin-reservation__type-row" hidden>予約タイプ<select name="reservation_type" class="wpplugin-reservation__type"><option value="時間貸">時間貸</option><option value="宿泊">宿泊</option></select></label>
        <div class="wpplugin-reservation__time-row wpplugin-reservation__hourly-times">
          <label>開始時刻<select name="reservation_start" required><option value="">選択してください</option></select></label>
          <label>終了時刻<select name="reservation_end" required><option value="">選択してください</option></select></label>
        </div>
        <p class="wpplugin-reservation__stay-fee" hidden>宿泊 <span>（<strong class="wpplugin-reservation__stay-fee-value"></strong>／泊）</span></p>
        <div class="wpplugin-reservation__additional-conditions"></div>
        <label>詳細<textarea name="reservation_details" rows="5"></textarea></label>
        <button type="submit">予約を保存</button>
        <button type="button" class="wpplugin-reservation__cancel" hidden>予約をキャンセル</button>
      </form>
    </section>
  </main>
  <script>
    const today = new Date();
    const calendar = document.querySelector('.wpplugin-calendar');
    const yearSelect = document.querySelector('.wpplugin-calendar__year');
    const monthSelect = document.querySelector('.wpplugin-calendar__month');
    for (let year = today.getFullYear() - 10; year <= today.getFullYear() + 10; year += 1) {
      yearSelect.insertAdjacentHTML('beforeend', `<option value="${year}"${year === today.getFullYear() ? ' selected' : ''}>${year}年</option>`);
    }
    for (let month = 1; month <= 12; month += 1) {
      monthSelect.insertAdjacentHTML('beforeend', `<option value="${month}"${month === today.getMonth() + 1 ? ' selected' : ''}>${month}月</option>`);
    }
  </script>
  <script src="calendar.js"></script>
</body>
</html>
